[project]
name = "vendor-match-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "gemini-shared",
  "google-api-python-client>=2.198.0,<3.0.0",
  "openpyxl>=3.1.0,<4.0.0",
  "pandas>=2.0.0,<3.0.0",
  "pyyaml>=6.0,<7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vendor_match_agent"]
