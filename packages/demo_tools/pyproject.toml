[project]
name = "demo-tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "gemini-shared[secrets]",
  "google-cloud-bigquery>=3.40.0,<4.0.0",
  "google-cloud-storage>=2.18.0,<4.0.0",
  "openpyxl>=3.1.0,<4.0.0",
  "reportlab>=4.2.0,<5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_tools"]
